apiVersion: apps/v1
kind: Deployment

metadata:
  name: opsboard-backend
  namespace: opsboard

  labels:
    app: opsboard
    component: backend

spec:
  replicas: 2

  revisionHistoryLimit: 3
  minReadySeconds: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: opsboard
      component: backend

  template:
    metadata:
      labels:
        app: opsboard
        component: backend

    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: opsboard-api:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: opsboard-backend-config

          env:
            - name: DATABASE_URL

              valueFrom:
                secretKeyRef:
                  name: opsboard-postgres-secret
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health
              port: http

            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: http

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL