apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: opsboard
  namespace: opsboard

  labels:
    app: opsboard

spec:
  ingressClassName: nginx

  rules:
    - host: opsboard.local

      http:
        paths:
          - path: /api
            pathType: Prefix

            backend:
              service:
                name: opsboard-backend

                port:
                  number: 4000

          - path: /
            pathType: Prefix

            backend:
              service:
                name: opsboard-frontend

                port:
                  number: 80